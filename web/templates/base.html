<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Itinerary Research{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <style>
    nav { padding: 0.75rem 1.5rem; border-bottom: 1px solid var(--pico-muted-border-color); }
    nav a { font-weight: 600; font-size: 1.1rem; text-decoration: none; }
    main { padding: 1.5rem; max-width: 1100px; margin: 0 auto; }
    .job-card { border: 1px solid var(--pico-muted-border-color); border-radius: 8px; margin-bottom: 1rem; overflow: hidden; }
    .job-header { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 1rem; background: var(--pico-card-background-color); }
    .job-body { padding: 0.5rem 1rem 1rem; }
    .status-badge { font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 4px; }
    .status-pending, .status-running { background: #fff3cd; color: #856404; }
    .status-done { background: #d1e7dd; color: #0a3622; }
    .status-error { background: #f8d7da; color: #58151c; }
    .spinner { display: inline-block; width: 1em; height: 1em; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: spin 0.6s linear infinite; vertical-align: middle; margin-right: 0.3rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    table { width: 100%; margin: 0; }
    td input[type=text] { margin: 0; padding: 0.2rem 0.4rem; font-size: 0.85rem; height: auto; }
    .link-icon { font-size: 0.9rem; }
    .actions { display: flex; gap: 0.5rem; align-items: center; }
    .btn-sm { padding: 0.25rem 0.6rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <nav>
    <a href="/projects">Itinerary Research</a>
  </nav>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
