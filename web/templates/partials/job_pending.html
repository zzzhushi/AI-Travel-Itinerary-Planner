<div class="job-card"
     id="job-{{ job.id }}"
     hx-get="/projects/{{ job.project_id }}/jobs/{{ job.id }}/status"
     hx-trigger="every 2s"
     hx-swap="outerHTML">
  <div class="job-header">
    <strong>{{ job.activity_query }}</strong>
    <span class="status-badge status-{{ job.status }}">
      <span class="spinner"></span>
      {% if job.status == "pending" %}queued{% else %}researching…{% endif %}
    </span>
  </div>
</div>
