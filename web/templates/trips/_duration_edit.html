<form id="duration-{{ opt.id }}"
  hx-patch="/trips/{{ trip_id }}/options/{{ opt.id }}/duration"
  hx-target="#duration-{{ opt.id }}"
  hx-swap="outerHTML"
  hx-trigger="change"
  class="flex items-center gap-1">
  <input
    type="number"
    name="duration_minutes"
    min="0"
    step="15"
    value="{{ opt.default_duration_minutes if opt.default_duration_minutes is not none else effective_default }}"
    title="Visit duration in minutes"
    class="w-16 border border-gray-200 rounded px-1.5 py-0.5 text-xs text-center focus:outline-none focus:ring-1 focus:ring-indigo-400
      {% if opt.default_duration_minutes is none %}text-gray-400{% else %}text-gray-700{% endif %}">
  <span class="text-xs text-gray-400">min
    {% if opt.default_duration_minutes is none %}
      <span class="italic">(default)</span>
    {% else %}
      <button type="submit" name="duration_minutes" value=""
        title="Reset to category default"
        class="ml-0.5 text-gray-300 hover:text-indigo-400 leading-none">↺</button>
    {% endif %}
  </span>
</form>
