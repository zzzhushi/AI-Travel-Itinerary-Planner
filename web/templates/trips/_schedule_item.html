<div id="schedule-item-{{ item.id }}"
  class="absolute inset-x-1 rounded overflow-hidden border flex flex-col px-1.5 py-0.5 text-xs
    {% if item.is_locked %}border-indigo-400 bg-indigo-50
    {% else %}border-gray-300 bg-white schedule-item cursor-grab{% endif %}"
  style="top: {{ item_top }}px; height: {{ item_height }}px; min-height: 20px;"
  data-item-id="{{ item.id }}"
  data-trip-id="{{ trip_id }}"
  data-day-num="{{ item.day_number }}"
  data-start-minutes="{{ item.start_minutes or 540 }}"
  {% if item.is_locked %}data-locked="true"{% endif %}>

  <div class="flex items-center gap-1 leading-tight overflow-hidden">
    <!-- Lock toggle -->
    <button
      onclick="fetch('/trips/{{ trip_id }}/schedule/{{ item.id }}', {method:'PATCH', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:'is_locked={{ 'false' if item.is_locked else 'true' }}'}).then(() => htmx.ajax('GET', '/trips/{{ trip_id }}/tabs/schedule', {target:'#trip-tabs', swap:'innerHTML'}))"
      title="{{ 'Locked — click to unlock' if item.is_locked else 'Unlocked — click to lock' }}"
      class="flex-shrink-0 transition-colors
        {% if item.is_locked %}text-indigo-500 hover:text-indigo-700{% else %}text-gray-300 hover:text-gray-500{% endif %}">
      {{ '🔒' if item.is_locked else '🔓' }}
    </button>
    <!-- Time label -->
    <span class="text-[10px] text-gray-400 flex-shrink-0">{{ (item.start_minutes or 540)|hhmm }}</span>
    <!-- Name -->
    <span class="font-medium text-gray-800 truncate">{{ item.option.name if item.option else "Unknown" }}</span>
    {% if item.option and item.option.maps_link %}
    <a href="{{ item.option.maps_link }}" target="_blank" rel="noopener"
       title="View on Google Maps"
       class="flex-shrink-0 text-gray-300 hover:text-indigo-500">📍</a>
    {% endif %}
  </div>

  {% if not item.is_locked %}
  <!-- Visible resize handle at bottom; targeted by interact.js edges -->
  <div class="resize-handle absolute bottom-0 inset-x-0 h-1.5 cursor-s-resize
              bg-gray-200 hover:bg-indigo-400 opacity-70 rounded-b"></div>
  {% endif %}

</div>
