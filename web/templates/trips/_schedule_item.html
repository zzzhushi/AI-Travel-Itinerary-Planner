<div id="schedule-item-{{ item.id }}" class="flex items-start gap-1.5 py-1">
  <!-- Lock toggle -->
  <button
    hx-patch="/trips/{{ trip_id }}/schedule/{{ item.id }}"
    hx-vals='{"is_locked": "{{ "false" if item.is_locked else "true" }}"}'
    hx-target="#schedule-item-{{ item.id }}"
    hx-swap="outerHTML"
    title="{{ 'Locked — click to unlock' if item.is_locked else 'Unlocked — click to lock' }}"
    class="text-sm mt-0.5 flex-shrink-0 transition-colors
      {% if item.is_locked %}text-indigo-500 hover:text-indigo-700{% else %}text-gray-300 hover:text-gray-500{% endif %}">
    {{ '🔒' if item.is_locked else '🔓' }}
  </button>
  <!-- Name -->
  <span class="text-xs text-gray-700 leading-tight">
    {{ item.option.name if item.option else "Unknown" }}
  </span>
</div>
