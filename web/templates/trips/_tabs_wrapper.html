<!-- Tab bar -->
<div class="flex gap-1 mb-4 border-b border-gray-200">
  {% for tab_name, tab_label in [("activities", "Activities"), ("options", "Rate options"), ("schedule", "Schedule"), ("preferences", "Preferences")] %}
  <button
    hx-get="/trips/{{ trip.id }}/tabs/{{ tab_name }}"
    hx-target="#trip-tabs"
    hx-swap="innerHTML"
    hx-push-url="/trips/{{ trip.id }}?tab={{ tab_name }}"
    class="px-4 py-2 text-sm font-medium rounded-t-lg transition-colors
      {% if active_tab == tab_name %}border-b-2 border-indigo-600 text-indigo-600
      {% else %}text-gray-500 hover:text-gray-700{% endif %}">
    {{ tab_label }}
    {% if tab_name == "activities" and unresearched_count > 0 %}
      <span class="ml-1 bg-orange-100 text-orange-700 text-xs px-1.5 py-0.5 rounded-full">{{ unresearched_count }}</span>
    {% elif tab_name == "options" and unrated_count > 0 %}
      <span class="ml-1 bg-yellow-100 text-yellow-700 text-xs px-1.5 py-0.5 rounded-full">{{ unrated_count }}</span>
    {% endif %}
  </button>
  {% endfor %}
</div>

<!-- Tab content -->
<div id="tab-content">
  {{ tab_content | safe }}
</div>
