<form id="activity-{{ act.id }}"
  hx-patch="/trips/{{ trip.id }}/activities/{{ act.id }}"
  hx-target="#activity-{{ act.id }}"
  hx-swap="outerHTML"
  class="flex flex-wrap items-center gap-2 bg-white border border-indigo-300 rounded-lg px-4 py-2 shadow-sm">

  <input name="query" value="{{ act.query }}" autofocus required
    class="flex-1 min-w-36 border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400"
    onkeydown="if(event.key==='Escape')document.getElementById('cancel-act-{{ act.id }}').click()">

  <select name="category"
    class="border border-gray-300 rounded px-2 py-1 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400">
    <option value="">— any —</option>
    {% for cat in categories %}
    <option value="{{ cat }}" {% if cat == act.category %}selected{% endif %}>{{ cat }}</option>
    {% endfor %}
  </select>

  <label class="flex items-center gap-1 text-sm text-gray-600">
    <input type="checkbox" name="is_specific" value="true" {% if act.is_specific %}checked{% endif %}>
    Specific
  </label>

  <button type="submit"
    class="bg-indigo-600 text-white px-3 py-1 rounded text-sm font-medium hover:bg-indigo-700">
    Save
  </button>

  <button type="button" id="cancel-act-{{ act.id }}"
    hx-get="/trips/{{ trip.id }}/activities/{{ act.id }}"
    hx-target="#activity-{{ act.id }}"
    hx-swap="outerHTML"
    class="text-gray-400 hover:text-gray-600 text-sm">Cancel</button>
</form>
